<!DOCTYPE html>
<!-- Three app screens in phone frames, same frame and layout as OncoSense's showreel Screens still
     (402x874 screen, 14px bezel, 120px gap, 1800x1240). Render with ./render.sh -->
<html>
<head>
<style>
  html, body { margin: 0; width: 1800px; height: 1240px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    /* RideTrack's orange, deepened to a warm dark, with a faint glow of the Start Ride purple */
    background:
      radial-gradient(ellipse 60% 45% at 50% 100%, rgba(108,92,231,0.18) 0%, transparent 70%),
      radial-gradient(ellipse at 50% 40%, #8A3E1C 0%, #3A1A0E 55%, #120805 100%);
  }
  .phone {
    position: absolute; top: 169px;
    width: 430px; height: 902px; padding: 14px; box-sizing: border-box;
    border-radius: 70px; background: #150B07;
    box-shadow: 0 0 0 2px rgba(255,214,190,0.22), 0 60px 120px rgba(20,6,2,0.6), 0 20px 40px rgba(20,6,2,0.4);
  }
  /* The web screenshots have no status bar, so the screen gets a 40px status strip in the
     shot's own top colour and the shot is fitted below it, unstretched. The ~8px left either
     side shows a pixel column ~3px in from the shot's edge (the outer columns carry a light line, so the shot is trimmed 3px each side too), stretched, so the edges stay continuous. */
  .screen { position: relative; width: 402px; height: 874px; border-radius: 56px; overflow: hidden; }
  .screen .edge { position: absolute; top: 40px; width: 12px; height: 834px; background-size: 22500% 100%; }
  .screen .edge.l { left: 0; background-position: -27px top; }
  .screen .edge.r { right: 0; background-position: right -27px top; }
  .screen .shot { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); height: 834px; clip-path: inset(0 3px); }
  .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 18px; background: #000; }
  .time { position: absolute; top: 18px; left: 0; width: 140px; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
  .icons { position: absolute; top: 21px; right: 30px; display: flex; gap: 6px; align-items: center; }
  .light { color: #fff; } .dark { color: #111111; }
</style>
</head>
<body>
  <template id="status">
    <div class="island"></div>
    <div class="time">9:41</div>
    <div class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.2A10.6 10.6 0 0 0 8 .5 10.6 10.6 0 0 0 .5 3.5l1.2 1.2A8.9 8.9 0 0 1 8 2.2Zm0 3.4c1.5 0 2.9.6 4 1.6l1.2-1.2A7.3 7.3 0 0 0 8 3.9a7.3 7.3 0 0 0-5.2 2.1L4 7.2a5.7 5.7 0 0 1 4-1.6Zm0 3.4c.6 0 1.2.2 1.6.6L8 11.3 6.4 9.6c.4-.4 1-.6 1.6-.6Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.8" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" fill="currentColor" opacity="0.4"/></svg>
    </div>
  </template>

  <div class="phone" style="left:135px"><div class="screen dark" style="background:#F8F9FB"><div class="edge l" style="background-image:url(welcome.png)"></div><div class="edge r" style="background-image:url(welcome.png)"></div><img class="shot" src="welcome.png"></div></div>
  <div class="phone" style="left:685px"><div class="screen light" style="background:linear-gradient(90deg,#FF9966,#FF7946)"><div class="edge l" style="background-image:url(home.png)"></div><div class="edge r" style="background-image:url(home.png)"></div><img class="shot" src="home.png"></div></div>
  <div class="phone" style="left:1235px"><div class="screen dark" style="background:#F5F5F5"><div class="edge l" style="background-image:url(goals.png)"></div><div class="edge r" style="background-image:url(goals.png)"></div><img class="shot" src="goals.png"></div></div>

  <script>
    const t = document.getElementById("status");
    document.querySelectorAll(".screen").forEach((s) => s.appendChild(t.content.cloneNode(true)));
  </script>
</body>
</html>
